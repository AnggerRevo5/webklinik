name: 🏥 Deploy Klinik

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: packages/backend/go.mod
    - run: go build ./...
      working-directory: packages/backend
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: packages/website/package-lock.json
    - run: npm ci
      working-directory: packages/website
    - run: npm run lint
      working-directory: packages/website

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Connect Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TS_AUTHKEY }}

    - name: 🐳 Login Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🌐 Build & Push Website
      uses: docker/build-push-action@v5
      with:
        context: ./packages/website
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/klinik-website:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🏗️ Build & Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./packages/backend
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/klinik-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🚀 Deploy ke Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/klinik
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          export MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          export MYSQL_USER=${{ secrets.MYSQL_USER }}
          export MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          docker compose pull backend frontend
          docker compose up -d
          docker system prune -f
          echo "✅ Deploy berhasil!"