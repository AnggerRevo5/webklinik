
services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: dockerfile
    container_name: backend
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
    ports:
      - "5000:5000"
    env_file:
      - ./packages/backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: ./packages/website
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./packages/website/.env
    depends_on:
      - backend

  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: klinik_db
      MYSQL_USER: klinik_user
      MYSQL_PASSWORD: klinik_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - webklinik_network

networks:
  webklinik_network:
    driver: bridge

volumes:
  db_data: