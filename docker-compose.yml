services:
  backend:
    build:
      context: ./packages/backend
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    # DB tidak lagi dijalankan sebagai container — backend terhubung langsung
    # ke server klinik. Semua konfigurasi (DB_HOST, Khanza, Cloudinary, PORT)
    # diambil dari packages/backend/.env.
    env_file:
      - ./packages/backend/.env
    restart: unless-stopped
    networks:
      - amc_network

  frontend:
    build:
      context: ./packages/website
      dockerfile: dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - amc_network

networks:
  amc_network:
    driver: bridge
