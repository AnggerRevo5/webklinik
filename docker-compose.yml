services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./SQL/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./SQL/db_klinik.sql:/sql/db_klinik.sql
      - ./SQL/sik.sql:/sql/sik.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - amc_network

  backend:
    build:
      context: ./packages/backend
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: db_klinik
      KHANZA_DB_HOST: mysql
      KHANZA_DB_USER: root
      KHANZA_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      KHANZA_DB_NAME: sik
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
    restart: unless-stopped
    networks:
      - amc_network

  frontend:
    build:
      context: ./packages/website
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    restart: unless-stopped
    networks:
      - amc_network

networks:
  amc_network:
    driver: bridge

volumes:
  mysql_data:
